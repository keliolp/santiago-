<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANTIAGO CONECTADO - Guía local 100% Santiago RD</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1115;color:white;font-family:system-ui,sans-serif;min-height:100vh}
  .top-bar{display:flex;justify-content:flex-end;padding:12px 20px;gap:8px}
  .lang-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px}
  .lang-btn.active{background:#FFD600;color:black;font-weight:bold;border-color:#FFD600}
  .hero{text-align:center;padding:40px 20px 20px}
  .hero h1{font-size:42px;line-height:1.1;font-weight:800}
  .hero h1 span{color:#FFD600}
  .subtitle{margin-top:12px;color:#a0a3ad}
  .search-wrap{max-width:700px;margin:24px auto;padding:0 20px}
  .search-box{display:flex;background:#1e222b;border-radius:14px;padding:6px;border:1px solid #2a2f3d}
  .search-box input{flex:1;background:transparent;border:none;color:white;padding:12px 16px;font-size:16px;outline:none}
  .search-box button{background:#FFD600;color:black;border:none;padding:0 24px;border-radius:10px;font-weight:bold;cursor:pointer}
  .filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
  .filter-btn{background:#2a2f3d;color:#cbd5e1;border:none;padding:8px 16px;border-radius:20px;cursor:pointer}
  .filter-btn.active{background:#FFD600;color:black;font-weight:bold}
</style>
</head>
<body>
  <div class="top-bar">
    <button class="lang-btn active" onclick="setLang('es',this)">🇩🇴 ES</button>
    <button class="lang-btn" onclick="setLang('en',this)">🇺🇸 EN</button>
    <button class="lang-btn" onclick="setLang('fr',this)">🇫🇷 FR</button>
    <button class="lang-btn" onclick="setLang('ht',this)">🇭🇹 HT</button>
  </div>
  <div class="hero">
    <h1 id="mainTitle">Bienvenido a <span>SANTIAGO CONECTADO</span></h1>
    <p class="subtitle" id="subTitle">Guía local 100% Santiago RD</p>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar restaurantes, tiendas, servicios...">
      <button id="goBtn">Ir</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-key="all">Todos</button>
      <button class="filter-btn" data-key="restos">Restaurantes</button>
      <button class="filter-btn" data-key="boutiques">Tiendas</button>
      <button class="filter-btn" data-key="services">Servicios</button>
      <button class="filter-btn" data-key="bars">Bares</button>
    </div>
  </div>
<script>
const translations={
  es:{main:'Bienvenido a <span>SANTIAGO CONECTADO</span>',sub:'Guía local 100% Santiago RD',search:'Buscar restaurantes, tiendas, servicios...',go:'Ir',filters:{all:'Todos',restos:'Restaurantes',boutiques:'Tiendas',services:'Servicios',bars:'Bares'}},
  en:{main:'Welcome to <span>SANTIAGO CONECTADO</span>',sub:'100% Local Guide Santiago RD',search:'Search restaurants, shops, services...',go:'Go',filters:{all:'All',restos:'Restaurants',boutiques:'Shops',services:'Services',bars:'Bars'}},
  fr:{main:'Bienvenue à <span>SANTIAGO CONECTADO</span>',sub:'Guide local 100% Santiago RD',search:'Chercher restos, boutiques, services...',go:'Go',filters:{all:'Tous',restos:'Restos',boutiques:'Boutiques',services:'Services',bars:'Bars'}},
  ht:{main:'Byenveni nan <span>SANTIAGO CONECTADO</span>',sub:'Gid lokal 100% Santiago RD',search:'Chèche restoran, boutik, sèvis...',go:'Ale',filters:{all:'Tout',restos:'Restoran',boutiques:'Boutik',services:'Sèvis',bars:'Ba'}}
};
function setLang(lang,btn){
  const t=translations[lang];
  document.getElementById('mainTitle').innerHTML=t.main;
  document.getElementById('subTitle').textContent=t.sub;
  document.getElementById('searchInput').placeholder=t.search;
  document.getElementById('goBtn').textContent=t.go;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    const k=b.dataset.key;
    if(t.filters[k]) b.textContent=t.filters[k];
  });
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
