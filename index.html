<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANTIAGO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0e0e10;color:#fff}header{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#0e0e10}.logo{color:#f5c542;font-weight:800;font-size:24px}.btn{border:none;padding:10px 16px;border-radius:99px;font-weight:700;cursor:pointer}.y{background:#f5c542;color:#000}.g{background:#222;color:#fff}.hero{padding:60px 20px;text-align:center}.hero h1{font-size:54px}.hero h1 b{color:#f5c542}.hero p{color:#888;margin-top:10px}.search{max-width:600px;margin:20px auto;display:flex;gap:8px;background:#1a1a1e;padding:8px;border-radius:14px;border:1px solid #2a2a2e}.search input{flex:1;background:0;border:0;color:#fff;padding:10px;outline:0}.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.f{padding:7px 14px;border-radius:99px;background:#1e1e22;border:1px solid #2a2a2e;cursor:pointer}.f.on{background:#f5c542;color:#000}.grid{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:0 20px}.card{background:#17171b;border:1px solid #23232a;border-radius:16px;overflow:hidden}.img{height:130px;background:#222;display:flex;align-items:center;justify-content:center;font-size:36px}.bd{padding:14px}.tt{font-weight:700}.mm{color:#888;font-size:12px}.dd{color:#aaa;font-size:13px;margin-top:6px}.form{max-width:600px;margin:40px auto;background:#121215;border:1px dashed #333;border-radius:16px;padding:20px}.form input,.form textarea,.form select{width:100%;margin-top:10px;background:#1e1e22;border:1px solid #2e2e33;color:#fff;padding:11px;border-radius:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}.modal.open{display:flex}.box{background:#18181c;width:90%;max-width:380px;border-radius:18px;padding:22px;border:1px solid #2a2a2e}.box input{width:100%;margin-top:10px;background:#1e1e22;border:1px solid #2e2e33;color:#fff;padding:11px;border-radius:10px}</style></head><body>
<header><div class="logo">SANTIAGO</div><div><span id="un" style="display:none;color:#f5c542;font-weight:700;margin-right:8px"></span><button id="lb" class="btn g">Connexion</button><button id="ob" class="btn g" style="display:none">Sortir</button></div></header>
<div class="hero"><h1>Bienvenido a <b>SANTIAGO CONECTADO</b></h1><p>Guide local 100% Santiago RD</p><div class="search"><input id="q" placeholder="Chercher..."><button class="btn y" onclick="R()">Go</button></div><div class="filters"><div class="f on" onclick="C('all',this)">Tous</div><div class="f" onclick="C('restaurant',this)">Restos</div><div class="f" onclick="C('boutique',this)">Boutiques</div><div class="f" onclick="C('service',this)">Services</div><div class="f" onclick="C('bar',this)">Bars</div></div></div>
<div id="grid" class="grid"></div>
<div class="form"><h3>Ajoute ton commerce</h3><input id="n" placeholder="Nom *"><select id="cc"><option value="restaurant">Restaurant</option><option value="boutique">Boutique</option><option value="service">Service</option><option value="bar">Bar</option></select><input id="qq" placeholder="Quartier"><input id="w" placeholder="WhatsApp"><textarea id="d" placeholder="Description"></textarea><button class="btn y" onclick="A()" style="width:100%;margin-top:10px">Publier</button><p id="fm" style="display:none;color:#f5c542;margin-top:8px"></p></div>
<div class="modal" id="mo"><div class="box"><h2 id="mt">Connexion</h2><input id="mn" placeholder="Nom" style="display:none"><input id="me" placeholder="Email"><input id="mp" type="password" placeholder="Mot de passe"><button class="btn y" style="width:100%;margin-top:10px" onclick="S()">Continuer</button><button class="btn g" style="width:100%;margin-top:8px" onclick="T()" id="tb">Inscription</button><button class="btn g" style="width:100%;margin-top:8px;background:0" onclick="X()">Fermer</button><p id="am" style="display:none;color:#ff6b6b;margin-top:8px"></p></div></div>
<script>
let cat='all',sign=false,user=JSON.parse(localStorage.getItem('santiago_user')||'null');
function C(c,e){cat=c;document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));e.classList.add('on');R()}
function U(){if(user){un.style.display='inline';un.textContent='Hola '+user.nom;lb.style.display='none';ob.style.display='inline';}else{un.style.display='none';lb.style.display='inline';ob.style.display='none';}}U();
lb.onclick=()=>O(false);ob.onclick=()=>{localStorage.clear();user=null;U();R()};q.addEventListener('input',R);
function O(s){sign=s;mo.classList.add('open');mt.textContent=s?'Inscription':'Connexion';mn.style.display=s?'block':'none';tb.textContent=s?'Déjà compte? Connexion':'Pas de compte? S\'inscrire'}
function X(){mo.classList.remove('open')}function T(){O(!sign)}
async function S(){let nom=mn.value.trim(),email=me.value.trim().toLowerCase(),pass=mp.value;try{let url=sign?'/api/signup':'/api/login';let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nom,email,password:pass})});let d=await r.json();if(!r.ok)throw new Error(d.error);user=d.user;localStorage.setItem('santiago_user',JSON.stringify(user));X();U();}catch(e){am.style.display='block';am.textContent=e.message}}
let list=[];async function F(){try{let r=await fetch('/api/commerces');list=await r.json();}catch{}if(!list.length)list=[{name:'Colmado Centro',cat:'boutique',quartier:'Centro',desc:'Produits locaux',emoji:'🏪'},{name:'Pica Pollo Tipico',cat:'restaurant',quartier:'Los Pepines',desc:'Meilleur pollo',emoji:'🍗'},{name:'Barberia La 30',cat:'service',quartier:'Pueblo Nuevo',desc:'Fade parfait',emoji:'💈'}];R()}
function R(){let qq=q.value.toLowerCase(),g=document.getElementById('grid'),f=list.filter(x=>{let txt=(x.name+' '+(x.quartier||'')+' '+(x.desc||'')).toLowerCase();return (qq===''||txt.includes(qq))&&(cat==='all'||(x.cat||'').toLowerCase()===cat)});g.innerHTML=f.map(x=>`<div class="card"><div class="img">${x.emoji||'📍'}</div><div class="bd"><div class="tt">${x.name}</div><div class="mm">${(x.cat||'').toUpperCase()} • ${x.quartier||'Santiago'}</div><div class="dd">${x.desc||''}</div></div></div>`).join('')}
async function A(){if(!user){O(false);return}let name=n.value.trim(),ccat=cc.value,quart=qq.value.trim(),what=w.value.trim(),desc=d.value.trim(),fm=document.getElementById('fm');if(!name){fm.style.display='block';fm.textContent='Nom obligatoire';return}let obj={name,cat:ccat,quartier:quart,whatsapp:what,desc,emoji:ccat==='restaurant'?'🍽️':ccat==='boutique'?'🛍️':ccat==='bar'?'🍹':'📍'};try{await fetch('/api/commerces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});list.unshift(obj);fm.style.display='block';fm.textContent='✅ Publié!';R();n.value='';d.value='';}catch{fm.style.display='block';fm.textContent='Erreur'}}
F();
</script></body></html>
